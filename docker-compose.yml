# Uso:
#   docker compose up -d                      -> backend + frontend (Ollama remoto vía Tailscale)
#   docker compose --profile ollama up -d     -> además levanta Ollama local con GPU NVIDIA

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    env_file:
      - ./backend/.env
    volumes:
      - ./data:/app/data
    # Hardening (docs/security.md): the PDF/image parser child shares this user and filesystem.
    read_only: true
    tmpfs:
      # Starlette spools multipart uploads (up to UPLOAD_MAX_MB) here.
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Second barrier over the 1 GB RLIMIT_AS of the parser child (adapters/files/isolated.py).
    mem_limit: 2g
    pids_limit: 128
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      # nginx-unprivileged keeps its pid file and proxy/body buffers in /tmp.
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging: *default-logging

volumes:
  ollama:
