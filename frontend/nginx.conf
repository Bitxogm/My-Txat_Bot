server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Matches UPLOAD_MAX_MB in backend/.env.example.
    # UPLOAD_MAX_MB (20) plus room for the multipart envelope.
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Chat replies are SSE: no buffering, and allow long gaps while a model loads
        # (OLLAMA_CHAT_READ_TIMEOUT_SECONDS defaults to 300).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
    }

    location /assets/ {
        # Vite fingerprints these file names, so they can be cached forever.
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        # SPA: unknown paths serve index.html, which must never be cached.
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
