name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (locked)
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t txatbot-backend:ci backend

  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t txatbot-frontend:ci frontend

  frontend:
    name: Frontend (ESLint + Prettier + tsc + Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not allowed in job-level `if`, so detection happens per step.
      - name: Detect frontend
        id: detect
        working-directory: .
        run: echo "present=${{ hashFiles('frontend/package.json') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        run: npm ci
      - if: steps.detect.outputs.present == 'true'
        run: npm run lint
      - if: steps.detect.outputs.present == 'true'
        run: npm run format:check
      - if: steps.detect.outputs.present == 'true'
        run: npx tsc -b
      - if: steps.detect.outputs.present == 'true'
        run: npm run test -- --run
      - if: steps.detect.outputs.present == 'true'
        run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          cp backend/.env.example backend/.env
          docker compose config -q
          docker compose --profile ollama config -q
