[project]
name = "txatbot-backend"
version = "0.0.0"
description = "Backend FastAPI de Txat_bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
