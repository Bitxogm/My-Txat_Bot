[project]
name = "txatbot-backend"
version = "0.0.0"
description = "Backend FastAPI de Txat_bot"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Prompt texts: lines are sent to the model as written, wrapping them would change the prompt.
"app/domain/builtin_personalities.py" = ["E501"]
"app/domain/prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
